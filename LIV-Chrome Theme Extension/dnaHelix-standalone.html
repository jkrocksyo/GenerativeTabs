<!--
  ============================================================================
  DNA HELIX — standalone reference (pure CSS/HTML)
  ============================================================================
  This file is a complete, working, pure CSS/HTML DNA helix background — no
  JavaScript. It is the canonical spec; the in-extension version
  (js/themes/dnaHelix.js) is a lightweight Canvas 2D port of it, since LiV's
  scene engine is canvas-based. Preserve these details if asked to modify it
  further:

  HOW THE LOOP WORKS — do not touch without understanding this first
  16 `.strand` elements exist: 10 real + 6 "loop extras". The container
  animates translateY(-10svh → -40svh), a scroll of exactly 3 strand-heights
  (10svh each), combined with rotateY(0turn → 0.7turn). The 6 extra strands
  exist purely so there's always enough pre-rendered content above/below the
  visible window to make that scroll-and-reset invisible. If you ever change
  strand count or the translateY range, the loop-extras count and the
  rotateY end value both need to change with it or the seam will show.

  Each strand's `--index` custom property (0, 0.1, 1.5) drives THREE
  independent things simultaneously: (1) its static rotateY position around
  the helix axis, (2) its ball's counter-rotation via the `ball` keyframe (so
  the balls stay oriented correctly as the whole assembly spins), and (3) a
  staggered `animation-delay` on the inner glow pulse. Don't refactor these
  into one shared value — they're deliberately three separate mechanisms
  keyed off the same variable.

  PERFORMANCE — LIGHTENED (see history below)
  This was flagged as heavy: ~200 rendered layers (16 strands × 6 real
  elements + 32 balls × 2 pseudo-elements each), animated `filter:
  drop-shadow(...)` and `filter: blur(...)` instances inside `preserve-3d` 3D
  transforms — filters stacked on 3D transforms is one of the more expensive
  combinations a browser compositor handles — plus a page-wide `filter:
  contrast(2.25)` on `body` that forced the whole visible output into a single
  filtered compositing unit rather than letting layers composite
  independently.

  Two of the recommended lightening changes have been APPLIED here:
  1. Removed `filter: contrast(2.25)` from `body`; the extra punch is baked
     into deeper gradient/color values instead of a runtime filter.
  2. Replaced the ball `filter: drop-shadow(...)` glow with a plain
     `box-shadow` (visually near-identical on a circular element, meaningfully
     cheaper). The right strand keeps only `filter: hue-rotate(178deg)` for
     its warm colour; its box-shadow is hue-rotated along with the ball, so
     the glow reads warm rather than the original's pure red — an accepted
     trade for dropping 32 drop-shadow filters.
  The `:before` blur pseudo-elements are left alone — they're more
  load-bearing to the glow look than the other two.

  ACCESSIBILITY
  `prefers-reduced-motion: reduce` pauses (not removes) the container/ball/
  ball__inner animations via `animation-play-state: paused`, freezing at
  their current computed transform rather than snapping to an arbitrary
  static pose.

  ATTRIBUTION
  Adapted from a pure CSS/HTML DNA helix by Sebastian Lenton, originally
  published as a public Pen on CodePen, used under CodePen's default MIT
  License for public Pens. The exact pen URL wasn't confirmed when this was
  built — if you have it, add it to this comment. Original was Haml/SCSS;
  this is a hand-translated plain HTML/CSS equivalent with the vignette
  overlay and reduced-motion handling added as new work.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiV — DNA Helix</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    perspective: 1400px;
    text-align: center;
    /* Deeper stops than the original #600/#003 to bake back the punch that the
       removed `filter: contrast(2.25)` used to add. */
    background: linear-gradient(-15deg, #7a0000, #000, #00335c);
  }

  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  .containerTilter {
    transform-style: preserve-3d;
    transform: rotate(-15deg);
  }
  .containerRotator {
    display: inline-block;
    height: 100%;
    width: 40svh;
    margin: 0 auto;
    transform-style: preserve-3d;
    animation: container 6s infinite linear;
  }
  .strand {
    height: 10svh;
    display: flex;
    align-items: center;
    padding: 0svh;
    transform: rotateY(calc(1turn * var(--index)));
    transform-style: preserve-3d;
  }
  .strand__ball {
    flex: 0 0 auto;
    aspect-ratio: 1/1;
    height: 100%;
    border-radius: 100%;
    animation: ball 6s infinite linear;
    backface-visibility: hidden;
    background-color: #32D0D9;
    background-image: radial-gradient(rgba(0,0,0,0), rgba(0,0,0,0) 50%, white);
    position: relative;
    /* was: filter: drop-shadow(0 0 1.5vh blue) — swapped for a cheaper box-shadow,
       glow dialed way down */
    box-shadow: 0 0 0.5vh blue;
  }
  .strand__ball:before, .strand__ball:after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(#1AB9B6, #05589c 38%, #05589c 48%, rgba(5,88,156,0) 78%, rgba(5,88,156,.75) 90%);
    top: -4%;
    left: -4%;
    border-radius: 100%;
  }
  .strand__ball:before { filter: blur(.25svh); }
  .strand__ball:after {
    width: 15%;
    height: 15%;
    background-image: radial-gradient(rgba(255,255,255,1), rgba(255,255,255,1) 15%, rgba(255,255,255,.35) 20%, rgba(255,255,255,.15) 45%, rgba(255,255,255,0) 75%);
    top: 22%;
    left: 22%;
  }
  .strand__ball--right {
    /* hue-rotate stays (it makes this strand warm); drop-shadow is gone */
    filter: hue-rotate(178deg);
  }
  .strand__ball__inner {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    animation: ball__inner 6s linear infinite;
    animation-delay: calc(var(--index) * -.33s);
    border-radius: 100%;
  }
  .strand__ball--right .strand__ball__inner {
    animation-delay: calc(var(--index) * -.33s + 3s);
  }
  .strand__stem {
    flex: 1;
    height: 10%;
    transform-style: preserve-3d;
    position: relative;
  }
  .strand__stem:before, .strand__stem:after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    aspect-ratio: 1/1;
    background: blue;
    transform: translateX(-50%) rotateY(90deg);
    border-radius: 100%;
    backface-visibility: hidden;
  }
  .strand__stem:after {
    left: unset; right: 0;
    transform: translateX(50%) rotateY(-90deg);
    background: red;
  }
  .strand__stem__inner {
    background: linear-gradient(90deg, blue, #3197C6 12.5%, white, #CC744D 87.5%, red);
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }
  .strand__stem__inner:before {
    content: "";
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background: linear-gradient(90deg, blue, #3197C6 12.5%, white, #CC744D 87.5%, red);
    transform: rotateX(90deg);
  }

  @keyframes container {
    from { transform: translateY(-10svh) rotateY(0turn); }
    to   { transform: translateY(-40svh) rotateY(0.7turn); }
  }
  @keyframes ball {
    from { transform: rotateY(calc(1turn - (1turn * var(--index)))); }
    to   { transform: rotateY(calc(0turn - (1turn * var(--index)) + 0.3turn)); }
  }
  @keyframes ball__inner {
    0%   { opacity: 0; }
    50%  { opacity: .4; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .containerRotator, .strand__ball, .strand__ball__inner {
      animation-play-state: paused;
    }
  }
</style>
</head>
<body>
<div class="containerTilter">

    <div class="strand" style="--index:0;">

    <div class="strand" style="--index:0.4;">

      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>

      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:0.6;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:0.7;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:0.8;">

    </div>
    <div class="strand" style="--index:0.9;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1.1;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1.2;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1.3;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1.4;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
    <div class="strand" style="--index:1.5;">
      <div class="strand__ball"><div class="strand__ball__inner"></div></div>
      <div class="strand__stem"><div class="strand__stem__inner"></div></div>
      <div class="strand__ball strand__ball--right"><div class="strand__ball__inner"></div></div>
    </div>
  </div>
</div>
<div id="vignette"></div>

</html>
